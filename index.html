<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>ClimateBar</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #16171b; color: #e6e7ea; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <p id="msg">Voltando para o ClimateBar…</p>
  <script>
    // Repassa o retorno do OAuth do SmartThings para o ClimateBar rodando no próprio PC.
    // Só os parâmetros do OAuth seguem adiante; o destino é fixo e local.
    (function () {
      var src = new URLSearchParams(location.search);
      var out = new URLSearchParams();
      ["code", "state", "error", "error_description"].forEach(function (k) {
        if (src.has(k)) out.set(k, src.get(k));
      });
      history.replaceState(null, "", location.pathname);
      if (!out.has("code") && !out.has("error")) {
        document.getElementById("msg").textContent = "Nada para repassar.";
        return;
      }
      location.replace("http://localhost:47615/callback?" + out.toString());
    })();
  </script>
</body>
</html>
